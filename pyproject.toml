[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eu-ai-act-compliance-mcp"
readme = "README.md"
version = "1.8.18"
description = "EU AI Act measurement for AI agents. 417 provisions from EUR-Lex via FTS5 search. Risk scan, deadline tracker, provision audit. Measurement, not certification. By CSOAI Ltd (Council of AI)."
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [{name = "CSOAI Ltd", email = "nicholas@csoai.org"}]
keywords = ["mcp", "mcp-server", "model-context-protocol", "ai-governance", "compliance", "eu-ai-act", "dora", "nis2", "cra", "gdpr", "meok"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["mcp>=2.0.0", "pydantic>=2.0.0"]

[project.urls]
Homepage = "https://meok.ai"
Repository = "https://github.com/CSOAI-ORG/eu-ai-act-compliance-mcp"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["server.py", "data/regulations.db", "llms.txt", ".cursorrules", "mcp2026_shim.py"]

[tool.hatch.build.targets.sdist.force-include]
"data/regulations.db" = "data/regulations.db"

[tool.hatch.build.targets.wheel.force-include]
"data/regulations.db" = "data/regulations.db"

[project.scripts]
eu-ai-act-compliance-mcp = "server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]


[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N"]
ignore = ["E501"]


[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_Configs = true
disallow_untyped_defs = true

